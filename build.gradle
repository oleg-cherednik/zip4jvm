import com.github.jk1.license.filter.LicenseBundleNormalizer
import com.github.jk1.license.render.InventoryHtmlReportRenderer

buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
    }
}

plugins {
    id 'jacoco'
    id 'java-library'
    id 'io.freefair.lombok' version '9.5.0'

    id 'dev.yumi.gradle.licenser' version '4.0.0'
    id 'com.github.jk1.dependency-license-report' version '3.1.1'
    id 'com.github.ben-manes.versions' version '0.53.0'

    id 'com.vanniktech.maven.publish' version '0.37.0'
}

repositories {
    mavenLocal()
    mavenCentral()
}

group = 'ru.oleg-cherednik.zip4jvm'
version = '1.13'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:unchecked','-Xlint:deprecation']
}

// Gradle 9 itself must run on JDK 17+, but tests can still be executed on an
// older JVM using a toolchain. Pass -Ptest.java.version=11 (or higher) to test
// on a specific JVM. Note: TestNG 7.6+ requires JDK 11+, so Java 8 is no longer
// a valid test runtime.
def testJavaVersion = Math.max((project.findProperty('test.java.version')
        ?: JavaVersion.current().majorVersion) as Integer, 11)

// The published library keeps Java 8 bytecode compatibility.
compileJava {
    options.release = 8
}

// Tests are not published and depend on libraries (TestNG, Mockito, ...) that
// require JDK 11+, so compile them for the test toolchain (minimum 11).
compileTestJava {
    options.release = testJavaVersion
}

tasks.named('jar') {
    archiveFileName = "${rootProject.name}-${version}.jar"
}

apply from: "${projectDir}/gradle/checkstyle.gradle"
apply from: "${projectDir}/gradle/pmd.gradle"

dependencies {
    annotationProcessor "org.projectlombok:lombok:${property('lombok.version')}"

    implementation 'org.slf4j:slf4j-api:2.0.18'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'com.github.luben:zstd-jni:1.5.7-12'
    implementation 'org.tukaani:xz:1.12'

    testAnnotationProcessor "org.projectlombok:lombok:${property('lombok.version')}"

    //noinspection VulnerableLibrariesLocal
    testImplementation 'org.testng:testng:7.12.0'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation "net.sf.sevenzipjbinding:sevenzipjbinding:${property('sevenzipjbinding.version')}"
    testImplementation "net.sf.sevenzipjbinding:sevenzipjbinding-all-platforms:${property('sevenzipjbinding.version')}"
    testImplementation 'net.lingala.zip4j:zip4j:2.11.6'
    //noinspection VulnerableLibrariesLocal
    testImplementation('de.idyl:winzipaes:1.0.1') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk16'
    }
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

javadoc {
    options.addBooleanOption('Xdoclint:-missing', true)
}

check.finalizedBy(generateLicenseReport)
check.finalizedBy(jacocoTestReport)

test {
    dependsOn('jar')
    useTestNG()

    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(testJavaVersion)
    }

    // sevenzipjbinding loads a native library via System::load, which JDK 16+
    // treats as a restricted operation. Grant native access to classpath code
    // to silence the warning (and avoid it being blocked in a future JDK).
    // The flag only exists on JDK 16+, so guard by the test JVM version.
    if (testJavaVersion >= 16) {
        jvmArgs '--enable-native-access=ALL-UNNAMED'
    }

    testLogging {
        showStandardStreams = true
    }
}

license {
    rule(file('APACHE.txt'))
    include('**/*.java')
}

licenseReport {
    configurations = ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath']
    renderers = [new InventoryHtmlReportRenderer()]
    allowedLicensesFile = new File("$projectDir/misc/license/allowed-licenses.json")
    filters = [new LicenseBundleNormalizer(bundlePath: "$projectDir/misc/license/license-normalizer-bundle.json")]
}

mavenPublishing {
    // leave empty for manual publishing via https://central.sonatype.com/publishing/deployments
    publishToMavenCentral(true)
    signAllPublications()

    coordinates(project.group as String, rootProject.name, project.version as String)

    pom {
        name = rootProject.name

        description = 'Zip files support for JDK application'
        url = 'https://github.com/oleg-cherednik/zip4jvm'
        inceptionYear = '2019'

        licenses {
            license {
                name = 'The Apache Software License, Version 2.0'
                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }

        developers {
            developer {
                id = 'oleg.cherednik'
                name = 'Oleg Cherednik'
                email = 'oleg.cherednik@gmail.com'
            }
        }

        scm {
            url = 'https://github.com/oleg-cherednik/zip4jvm'
            connection = 'scm:https://github.com/oleg-cherednik/zip4jvm.git'
            developerConnection = 'scm:git@github.com:oleg-cherednik/zip4jvm.git'
        }
    }
}

tasks.register('fatJar', Jar) {
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
                'Main-Class': '',
                'Built-By': 'oleg.cherednik',
                'Built-Date': new Date(),
                'Built-JDK': System.getProperty('java.version'),
                'Built-Gradle': gradle.gradleVersion
        )
    }

    from {
        configurations.runtimeClasspath.collect {it.isDirectory() ? it : zipTree(it)}
    }

    with jar
}
