name: Android compatibility

on:
  push:
  pull_request:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish zip4jvm to Maven Local
        run: ./gradlew publishToMavenLocal

      - name: Create Android compatibility project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android-check/app/src/main/java/com/example/androidcheck
          mkdir -p android-check/app/src/main/res/values
          cp -R gradle android-check/
          cp gradlew android-check/
          cp gradlew.bat android-check/

          cat > android-check/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  mavenLocal()
              }
          }

          rootProject.name = 'android-check'
          include ':app'
          EOF

          cat > android-check/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '9.0.1' apply false
          }
          EOF

          cat > android-check/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.androidcheck'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.example.androidcheck'
                  minSdk 23
                  targetSdk 36
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'ru.oleg-cherednik.zip4jvm:zip4jvm:1.13'
          }
          EOF

          cat > android-check/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@style/AppTheme" />
          </manifest>
          EOF

          cat > android-check/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat > android-check/app/src/main/java/com/example/androidcheck/MainActivity.java <<'EOF'
          package com.example.androidcheck;

          import android.app.Activity;
          import android.os.Bundle;
          import ru.oleg.cherednik.zip4jvm.Zip4jvm;

          public final class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // Reference the library from an Android application so D8/R8 and
                  // Android Lint verify that the published Java artifact is consumable.
                  Class<?> libraryClass = Zip4jvm.class;
                  if (libraryClass == null) {
                      throw new AssertionError("zip4jvm is not available");
                  }
              }
          }
          EOF

      - name: Build Android application
        working-directory: android-check
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Run Android Lint
        working-directory: android-check
        run: ./gradlew --no-daemon --stacktrace lintDebug
