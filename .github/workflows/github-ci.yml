name: Build and tests
on: push
jobs:
  java-8:
    uses: oleg-cherednik/github-workflows/.github/workflows/gradle-java-build-test.yml@main
    with:
      java-version: '8'
      # Gradle must run on JDK 11+ (com.vanniktech.maven.publish);
      # the code is still compiled against and tested on Java 8
      gradle-java-version: '17'
      codacy-report: true
    secrets: inherit
    permissions:
      contents: read
      packages: write
  java-11:
    uses: oleg-cherednik/github-workflows/.github/workflows/gradle-java-build-test.yml@main
    with:
      java-version: '11'
    secrets: inherit
    permissions:
      contents: read
      packages: write
  java-17:
    uses: oleg-cherednik/github-workflows/.github/workflows/gradle-java-build-test.yml@main
    with:
      java-version: '17'
    secrets: inherit
    permissions:
      contents: read
      packages: write
  java-21:
    uses: oleg-cherednik/github-workflows/.github/workflows/gradle-java-build-test.yml@main
    with:
      java-version: '21'
    secrets: inherit
    permissions:
      contents: read
      packages: write
  # java-25 requires upgrading the Gradle wrapper to 9.1+ (currently 8.10.2):
  # Gradle supports Java 25 neither as a toolchain nor as a runtime before 9.1.0

