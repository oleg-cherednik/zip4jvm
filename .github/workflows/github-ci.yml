name: Build and tests
on: push
jobs:
  java-8:
    uses: oleg-cherednik/github-workflows/.github/workflows/gradle-java-build-test.yml@main
    with:
      java-version: 8
      # Gradle 9 must run on JDK 17+; the code is still
      # compiled against and tested on Java 8
      gradle-java-version: 17
      codacy-report: true
    secrets: inherit
    permissions:
      contents: read
      packages: write
  java-11:
    uses: oleg-cherednik/github-workflows/.github/workflows/gradle-java-build-test.yml@main
    with:
      java-version: 11
      # Gradle 9 must run on JDK 17+; the code is still
      # compiled against and tested on Java 11
      gradle-java-version: 17
    secrets: inherit
    permissions:
      contents: read
      packages: write
  java-17:
    uses: oleg-cherednik/github-workflows/.github/workflows/gradle-java-build-test.yml@main
    with:
      java-version: 17
    secrets: inherit
    permissions:
      contents: read
      packages: write
  java-21:
    uses: oleg-cherednik/github-workflows/.github/workflows/gradle-java-build-test.yml@main
    with:
      java-version: 21
    secrets: inherit
    permissions:
      contents: read
      packages: write
  java-25:
    uses: oleg-cherednik/github-workflows/.github/workflows/gradle-java-build-test.yml@main
    with:
      java-version: 25
    secrets: inherit
    permissions:
      contents: read
      packages: write
  android-17:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
      - name: Set up Java-17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Publish zip4jvm to Maven Local
        run: ./gradlew publishToMavenLocal
      - name: Create Android compatibility project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android-check/app/src/main/java/com/example/androidcheck
          mkdir -p android-check/app/src/main/res/values
          cp -R gradle android-check/
          cp gradlew android-check/
          cp gradlew.bat android-check/

          cat > android-check/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  mavenLocal()
              }
          }

          rootProject.name = 'android-check'
          include ':app'
          EOF

          cat > android-check/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '9.0.1' apply false
          }
          EOF

          cat > android-check/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.androidcheck'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.example.androidcheck'
                  # zip4jvm uses java.nio.file.* which is only available on Android API 26+
                  minSdk 26
                  targetSdk 36
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'ru.oleg-cherednik.zip4jvm:zip4jvm:1.13'
          }
          EOF

          cat > android-check/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@style/AppTheme" />
          </manifest>
          EOF

          cat > android-check/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat > android-check/app/src/main/java/com/example/androidcheck/MainActivity.java <<'EOF'
          package com.example.androidcheck;

          import android.app.Activity;
          import android.os.Bundle;
          import ru.olegcherednik.zip4jvm.ZipIt;

          public final class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // Reference the library from an Android application so D8/R8 and
                  // Android Lint verify that the published Java artifact is consumable.
                  Class<?> libraryClass = ZipIt.class;
                  if (libraryClass == null) {
                      throw new AssertionError("zip4jvm is not available");
                  }
              }
          }
          EOF

      - name: Build Android application
        working-directory: android-check
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Run Android Lint
        working-directory: android-check
        run: ./gradlew --no-daemon --stacktrace lintDebug
